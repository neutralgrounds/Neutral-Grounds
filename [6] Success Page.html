<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Registration Successful</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
*{
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  box-sizing: border-box;
}

:root {
  --bg1: #070b1a;
  --bg2: #0b1020;
  --glass: rgba(255,255,255,0.05);
  --accent: #00f5ff;
  --accent2: #a855f7;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

body {
  background: radial-gradient(circle at top, var(--bg2), var(--bg1));
  margin: 0;
  padding-top: 100px;
  color: var(--text);
  min-height: 100vh;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  background: rgba(10, 10, 30, 0.7);
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 80px;
  backdrop-filter: blur(15px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  z-index: 1000;
}

.logo {
  height: 55px;
}

.NG {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.1;
  margin-left: 10px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* BACKGROUND */
.bg {
  position: fixed;
  top: 0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-1;
  opacity:0.12;
}

/* BUTTON */
.home_page-btn {
  position: absolute;
  top: 20px;
  right: 70px;
  padding: 10px 18px;
  border-radius: 12px;
  background: linear-gradient(90deg, #00f5ff, #a855f7);
  color: black;
  font-weight: bold;
  border: none;
  cursor: pointer;
  transition: 0.3s ease;
}

.home_page-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(0,245,255,0.5);
  color: white;
}

/* CONTAINER */
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px;
}

/* CARD */
.card {
  width: 650px;
  padding: 35px;
  border-radius: 20px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 0 40px rgba(0, 245, 255, 0.08);
  animation: fadeIn 0.7s ease;
}

.card h1 {
  text-align: center;
  font-size: 30px;
  margin-bottom: 10px;
}

.card p {
  text-align: center;
  color: var(--muted);
  margin-bottom: 25px;
  line-height: 1.6;
}

/* SUCCESS ICON */
.success-icon {
  width: 90px;
  height: 90px;
  margin: auto;
  border-radius: 50%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  color: black;
  margin-bottom: 20px;
  font-weight: bold;
  box-shadow: 0 0 25px rgba(0,245,255,0.5);
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 10px;
}

th {
  background: #08142e;
  padding: 12px;
  color: white;
  text-align: left;
}

td {
  padding: 12px;
  text-align: center;
  background: rgba(255,255,255,0.03);
}

tr {
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

/* BUTTONS */
.action-buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 30px;
}

.action-buttons button {
  padding: 12px 22px;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s ease;
}

.claim-btn {
  background: linear-gradient(90deg, #00f5ff, #a855f7);
  color: black;
}

.claim-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(0,245,255,0.5);
  color: white;
}

.dashboard-btn {
  background: rgba(255,255,255,0.08);
  color: white;
  border: 1px solid rgba(255,255,255,0.15);
}

.dashboard-btn:hover {
  background: rgba(255,255,255,0.15);
}

/* ANIMATION */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>
</head>

<body>

<img src="[f] background.jpg" alt="background" class="bg">

<!-- HEADER -->
<header class="header">
  <img src="[a] NG-Logo.png" alt="Neutral Grounds Logo" class="logo">

  <h1 class="NG">
    NEUTRAL <br> GROUNDS
  </h1>

  <button class="home_page-btn" onclick="window.location.href='index.html'">
    Home Page
  </button>
</header>

<!-- CONTENT -->
<div class="container">

  <div class="card">

    <div class="success-icon">✓</div>

    <h1>Registration Successful!</h1>

    <p>
      Welcome to the Neutral Grounds Family! <br>
      Your registration has been recorded successfully.
      Please proceed to claim your ID at Neutral Grounds.
    </p>

    <!-- SUMMARY TABLE -->
    <table>

      <tr>
        <th colspan="2" style="text-align:center;">
          Personal Information
        </th>
      </tr>

      <tr>
        <th>Name</th>
        <td id="summaryName"></td>
      </tr>

      <tr>
        <th>Email</th>
        <td id="summaryEmail"></td>
      </tr>

      <tr>
        <th>Branch Location</th>
        <td id="summaryBranch"></td>
      </tr>

      <tr>
        <th>Time</th>
        <td id="summaryTime"></td>
      </tr>

      <tr>
        <th>Date</th>
        <td id="summaryDate"></td>
      </tr>

      <tr>
        <th>Game Name</th>
        <td id="summaryGame"></td>
      </tr>

    </table>

    <!-- ACTION BUTTONS -->
    <div class="action-buttons">

      <button class="claim-btn"
      onclick="window.location.href='claim.html'">
        Claim ID
      </button>

      <button class="dashboard-btn"
      onclick="window.location.href='dashboard.html'">
        Continue
      </button>

    </div>

  </div>

</div>

</body>
<script>
window.addEventListener("DOMContentLoaded", function () {
  const data = JSON.parse(localStorage.getItem("userData"));

  if (!data) {
window.location.href = "index.html";
    return;
  }

  document.getElementById("summaryName").textContent = data.username;
  document.getElementById("summaryEmail").textContent = data.email;
  document.getElementById("summaryBranch").textContent = data.branch_loc;
  document.getElementById("summaryDate").textContent = data.date;
  document.getElementById("summaryTime").textContent = data.time;
  document.getElementById("summaryGame").textContent = data.game_name;
});

</script>
</html>
