*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;

}

:root{
  --bg1:#070b1a;
  --bg2:#0b1020;
  --glass:rgba(255,255,255,0.06);
  --glass2:rgba(255,255,255,0.12);

}

/* BODY */
body{
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, var(--bg2), var(--bg1));
  color: var(--text);
  overflow-x: hidden;
  padding-top: 110px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center; 
}

/* BACKGROUND */
.bg{
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.15;
  z-index: -2;
}

/* GLOW EFFECTS */
body::before{
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  top: -120px;
  right: -120px;
  background: radial-gradient(
    circle,
    rgba(0,245,255,0.18),
    transparent 70%
  );
  z-index: -1;
}

body::after{
  content: "";
  position: fixed;
  width: 450px;
  height: 450px;
  bottom: -120px;
  left: -120px;
  background: radial-gradient(
    circle,
    rgba(168,85,247,0.18),
    transparent 70%
  );
  z-index: -1;
}

/* HEADER */
.header{
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 80px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 25px;
  background: rgba(8,12,28,0.7);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  z-index: 1000;
}

.logo{
  height: 55px;
}

.NG{
  font-size: 20px;
  font-weight: 800;
  line-height: 1.1;

  background: linear-gradient(
    90deg,
    var(--accent),
    var(--accent2)
  );

  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 20px rgba(0,245,255,0.25);
}

/* HOME BUTTON */
.home_page-btn{
  position: fixed;
  top: 20px;
  right: 35px;
  padding: 11px 20px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(
    90deg,
    var(--accent),
    var(--accent2)
  );
  color: black;
  font-weight: 700;
  cursor: pointer;
  transition: 0.3s ease;
  z-index: 1100;
}

.home_page-btn:hover{
  transform: scale(1.05);
  box-shadow:
    0 0 20px rgba(0,245,255,0.4);
  color: white;
}

/* CONTAINER */ 
.container { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 20px; 
  padding: 20px; 
}

/* CARD */
.card{
  width: 100%;
  max-width: 620px; /* to make it wider */
  padding: 40px;
  border-radius: 26px;
  background: var(--glass);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 0 50px rgba(0,245,255,0.08);
  transition: 0.35s ease;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.8s ease;
  margin: auto;
}
/* CARD GLOW */
.card::before{
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  top: -120px;
  right: -120px;
  background: radial-gradient(
    circle,
    rgba(255,255,255,0.10),
    transparent 70%
  );
  pointer-events: none;
}

.card:hover{
  transform: translateY(-6px);
  box-shadow:
    0 0 65px rgba(0,245,255,0.16);
}

/* HEADINGS */
.card h3{
  text-align: center;
  font-size: 28px;
  margin-bottom: 28px;
  color: white;
  letter-spacing: 1px;
}

.card p{
  text-align: center;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 15px;
}

/* LABELS */
label{
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}

/* INPUTS */
input,
select{
  width: 100%;
  padding: 14px;
  margin-bottom: 18px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  color: white;
  outline: none;
  transition: 0.3s ease;
  font-size: 14px;
}

/* PLACEHOLDER */
input::placeholder{
  color: rgba(255,255,255,0.45);
}

/* SELECT OPTIONS */
select option{
  color: black;
  background: white;
}

/* FOCUS */
input:focus,
select:focus{
  border-color: var(--accent);
  box-shadow:
    0 0 12px rgba(0,245,255,0.4);
  background: rgba(255,255,255,0.06);
}

/* BUTTON */
.btn{
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(
    90deg,
    var(--accent),
    var(--accent2)
  );
  color: black;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.3s ease;
}

.btn:hover{
  transform: scale(1.03);
  box-shadow:
    0 0 25px rgba(0,245,255,0.45);
  color: white;
}

/* OTP FLEX BUTTONS */
#otpCard div{
  display: flex;
  gap: 10px;
}

/* OTP MESSAGE */
#otpMessage{
  text-align: center;
  font-weight: 600;
}

/* TIMER */
.timer{
  color: #ff5e5e;
  font-weight: bold;
}

/* HIDDEN */
.hidden{
  display: none;
}

/* ANIMATION */
@keyframes fadeUp{
  from{
    opacity: 0;
    transform: translateY(25px);
  }

  to{
    opacity: 1;
    transform: translateY(0);
  }
}

/* MOBILE */
@media(max-width: 600px){

  .card{
    padding: 28px 22px;
  }

  .card h3{
    font-size: 22px;
  }

  .home_page-btn{
    right: 15px;
    padding: 10px 14px;
    font-size: 12px;
  }
}
</style>

<script>
  // ELEMENTS 
  emailjs.init("R4JBm8GAtt1wXmYwl");

  const nameFields= document.getElementById('nameFields');
  const sendOtpBtn = document.getElementById('sendOtpBtn');
  const otpCard = document.getElementById('otpCard');
  const otpInput = document.getElementById('otpInput');
  const timerDisplay = document.getElementById('timerDisplay');
  const otpMessage = document.getElementById('otpMessage');
  const verifyBtn = document.getElementById('verifyBtn');
  const resendBtn = document.getElementById('resendBtn');
  const successCard = document.getElementById('successCard');
  const submitFinal = document.getElementById('submitFinal');
  const goToNextPageBtn=document.getElementById('goToNextPage');

  function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}
  // OTP variables
  let generatedOTP = '';
  let countdown = null;
  const OTP_VALID_SECONDS = 120;

  function generateOTP(length = 6) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let otp = '';
    for (let i = 0; i < length; i++) {
      otp += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return otp;
  }

  function startTimer() {
    clearInterval(countdown);
    let remaining = OTP_VALID_SECONDS;
    timerDisplay.textContent = remaining;
    countdown = setInterval(() => {
      remaining--;
      timerDisplay.textContent = remaining;
      if (remaining <= 0) {
        clearInterval(countdown);
        otpMessage.textContent = 'OTP expired — please resend.';
        otpMessage.style.color = 'red';
      }
    }, 1000);
  }

  // to generate OTP
function sendOTP() {
  const email = document.getElementById('email').value.trim();

  if (!email) {
    alert("Email is required.");
    return;
  }

  if (!isValidEmail(email)) {
    alert("Invalid email format.");
    return;
  }

  generatedOTP = generateOTP(6);

  let params = {
    to_email: email,
    otp: generatedOTP
  };

  emailjs.send("service_zc7tgmk", "template_412ojst", params)
    .then(() => {
      alert("OTP sent!");
      otpCard.classList.remove("hidden");
      startTimer();
    })
    .catch(err => {
      console.error(err);
      alert("EmailJS Error: " + JSON.stringify(err));
    });
}

  // to verify OTP
  function verifyOTP() {
    const userOTP = otpInput.value.trim();
    if (!userOTP) {
      otpMessage.textContent = 'Please enter the OTP.';
      otpMessage.style.color = 'red';
      return;
    }

    if (parseInt(timerDisplay.textContent) <= 0) {
      otpMessage.textContent = 'OTP expired. Please resend.';
      otpMessage.style.color = 'red';
      return;
    }

if (userOTP === generatedOTP) {
  clearInterval(countdown);
  otpMessage.textContent = 'OTP Verified!';
  otpMessage.style.color = 'green';

  successCard.classList.remove('hidden');

    } else {
      otpMessage.textContent = 'Invalid OTP. Please click Resend.';
      otpMessage.style.color = 'red';
    }
  }

  // Resend OTP
  function resendOTP() {
    const email = document.getElementById('email').value.trim();
    if (!email) {
      alert('Email not found. Please re-enter your email.');
      return;
    }

    generatedOTP = generateOTP(6);

const username = document.getElementById('username').value;
let params = {
  otp: generatedOTP,
  to_email: email,
  username: username  
    };

    emailjs.send("service_zc7tgmk", "template_412ojst", params)
      .then(() => {
        otpMessage.textContent='New OTP sent successfully!';
        otpMessage.style.color='green';
        otpInput.value="";
        startTimer();
        console.log("Resent OTP:", generatedOTP); 
      })
      .catch(err => {
        otpMessage.textContent='Failed to resend OTP. Try again';
        otpMessage.style.color='red';
        console.error(err);
      });
  }


  sendOtpBtn.addEventListener('click', sendOTP);
  verifyBtn.addEventListener('click', verifyOTP);
  resendBtn.addEventListener('click', resendOTP);

async function saveUserData() {
  const { collection, addDoc } = window.firestoreLib;
  const db = window.db;

  const userData = {
    username: document.getElementById("username").value,
    email: document.getElementById("email").value,
    branch_loc: document.getElementById("branch_loc").value,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    game_name: document.getElementById("game_name").value,
    status: "Pending",
    timestamp: new Date().toISOString()
  };

  try {
    await addDoc(collection(db, "players"), userData);
    console.log("Player saved to Firestore!");
    alert("Registration saved successfully!");
  } catch (e) {
    console.error("Error saving:", e);
    alert("Error saving registration: " + e.message);
  }
}

goToNextPageBtn.addEventListener("click", async function () {
  await saveUserData();

  // GET VALUES
  const userData = {
    username: document.getElementById("username").value,
    email: document.getElementById("email").value,
    branch_loc: document.getElementById("branch_loc").value,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    game_name: document.getElementById("game_name").value
  };

  // SAVE TO LOCAL STORAGE
  localStorage.setItem("userData", JSON.stringify(userData));

  // GO TO SUMMARY PAGE
  window.location.href = "[6] Success Page.html";
});
