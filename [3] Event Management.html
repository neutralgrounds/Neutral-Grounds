<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Event Management</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  
  <style>
:root {
  --bg1: #070b1a;
  --bg2: #0b1020;
  --glass: rgba(255,255,255,0.05);
  --glass2: rgba(255,255,255,0.08);
  --accent: #00f5ff;
  --accent2: #a855f7;
  --text: #e5e7eb;
  --muted: #94a3b8;
}
.header {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  background-color:rgb(11, 11, 41);
  position: fixed; 
  gap: 12px;
  top: 0; 
  left: 0; 
  width: 100%; 
  height: 80px;
  backdrop-filter: blur(15px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  z-index: 1000;
}
.logo {
  height: 70px;   
  margin-right: 0px;
}
.NG {
  font-size: 25px;
  font-weight: 800;
  line-height: 1.1;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 10px rgba(0, 245, 255, 0.3);
}
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, var(--bg2), var(--bg1));
  color: var(--text);
  display: flex;
  padding-top: 75px;
}
.sidebar {
  width: 230px;
  height: 100vh;
  background-color:rgb(11, 11, 41);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  position: fixed;
  left: 0;
  top: 90px;
  backdrop-filter: blur(15px);
  border-right: 1px solid rgba(255,255,255,0.08);
}
.sidebar h2 {
  color: white;
  margin-bottom: 20px;
}
.sidebar a {
  color: #cbd5e1;
  text-decoration: none;
  padding: 10px;
  border-radius: 8px;
  transition: 0.3s;
}
.sidebar a:hover {
  background: #1e293b;
  color: white;
}
.main-content {
  margin-left: 250px;
  padding: 30px;
  width: 100%;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  text-decoration: none;
  color: var(--muted);
  transition: 0.25s;
}
.menu-item:hover {
  background: rgba(0,245,255,0.08);
  color: white;
  box-shadow: 0 0 12px rgba(0,245,255,0.2);
}
.menu-icon {
  width: 20px;
  height: 20px;
  object-fit: contain;
}
</style>
</head>
<!--Header and Logo-->
<header class="header">    
  <img src="logo.png" alt="Neutral Grounds Logo" class="logo">
  <h1 class="NG">
  Neutral <br>
  Grounds</h1>
</header>

<!--SideBar-->
<body>
    <div class="sidebar">
  <a href="[2] Staff Dashboard.html" class="menu-item">
    <img src="home.png" class= "menu-icon">
    <span>Dashboard</span>
</a>
  <a href="[3] Event Management.html" class="menu-item">
    <img src="event.png" class= "menu-icon">
    <span>Event Tasks</span>
  </a>
  <a href="index.html" class="menu-item">
    <img src="logout.png" class= "menu-icon">
    <span>Log Out</span>
</a>
</div>
<!--START OF FUNCTIONS-->

</body>

  </html>
